<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DM-MUSEUM</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header-area">
        <div class="banner-box">
            <img class="banner-img" src="images/my-dm-banner.jpg" alt="BANNER">
        </div>
        <h1 class="site-title">DM-MUSEUM</h1>
        <hr class="sep">
    </header>

    <div class="main-wrapper">
        <aside class="left-side">
            <div class="pixel-box roles-box">
                <span class="box-title">角色栏目</span>
                <ul class="role-list">
                    <li class="role-item"><img class="avatar" src="images/avatars/atem.jpg" alt="Atem"><span class="role-name">亚图姆 (Atem)</span></li>
                    <li class="role-item"><img class="avatar" src="images/avatars/yugi.jpg" alt="Yugi"><span class="role-name">武藤游戏</span></li>
                    <li class="role-item"><img class="avatar" src="images/avatars/jo.jpg" alt="Jonouchi"><span class="role-name">城之内克也</span></li>
                    <li class="role-item"><img class="avatar" src="images/avatars/kaiba.jpg" alt="Kaiba"><span class="role-name">海马濑人</span></li>
                    <li class="role-item"><img class="avatar" src="images/avatars/bakura.jpg" alt="Bakura"><span class="role-name">貘良了</span></li>
                </ul>
            </div>
            <div class="pixel-box">
                <span class="box-title">彩蛋 / Fun</span>
                <p class="small-note">[ 隐藏档案 ]</p>
                <p class="small-note">[ 幕后花絮 ]</p>
            </div>
        </aside>

        <main class="right-side">
            <div class="article-box pixel-box">
                <div class="article-image" style="background-image: url('images/article-1.jpg')"> </div>
                <div class="article-caption">
                    <h2 class="article-title">大图 1 标题</h2>
                    <p class="article-desc">这是第一张大图的说明文本，使用复古日报风格的简短描述。</p>
                </div>
            </div>

            <div class="article-box pixel-box">
                <div class="article-image" style="background-image: url('images/article-2.jpg')"> </div>
                <div class="article-caption">
                    <h2 class="article-title">大图 2 标题</h2>
                    <p class="article-desc">这是第二张大图的说明文本，格式与上方一致，保持布局对称。</p>
                </div>
            </div>
        </main>
    </div>

    <footer class="pixel-footer">
        <p>Copyright © 2026 DM-MUSEUM. All Rights Reserved.</p>
        <p class="copyright-legal">© KONAMI/游戏王官方，为版权所有</p>
    </footer>
</body>
</html>
